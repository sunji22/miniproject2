<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 챌린지 — 보증금 챌린지</title>
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/receipt.css" />
</head>
<body>
  <header class="appbar" id="appbar"></header>
  <main class="wrap" style="padding-top:16px">
    <h1 class="page-title">내 챌린지</h1>
    <div class="stack" id="list" style="max-width:520px;margin:16px auto"></div>
    <div class="empty" id="empty" style="display:none">참여한 챌린지가 없습니다. <a href="/">챌린지 둘러보기 ›</a></div>
  </main>

  <script src="/assets/js/common.js"></script>
  <script>
    const { api, el, esc, statusStamp, PARTICIPATION_STATUS, mountHeader, requireAuth, toast, session } = App;
    mountHeader('/challenge/my.html');
    if (!requireAuth()) throw new Error('redirecting');

    async function load() {
      const listEl = document.getElementById('list');
      const emptyEl = document.getElementById('empty');
      listEl.innerHTML = ''; emptyEl.style.display = 'none';
      try {
        // 내 참여 목록 + 전체 챌린지(hostId 매핑용) 동시 조회
        const [items, all] = await Promise.all([
          api.get('/api/challenges/my/participations'),
          api.get('/api/challenges?size=200').catch(() => []),
        ]);
        if (!items || items.length === 0) { emptyEl.style.display = 'block'; return; }
        const hostMap = {};
        (all || []).forEach((c) => { hostMap[c.id] = c.hostId; });
        const recent = (a, b) => new Date(b.joinedAt) - new Date(a.joinedAt);
        const isInactive = (p) => p.myStatus === 'CANCELED' || p.challengeStatus === 'DELETED';
        const active = items.filter((p) => !isInactive(p));
        const inactive = items.filter(isInactive).sort(recent);
        const hosted = active.filter((p) => hostMap[p.challengeId] === session.userId).sort(recent);
        const joined = active.filter((p) => hostMap[p.challengeId] !== session.userId).sort(recent);
        // 구분선 섹션 (최신이 위, 취소·삭제는 맨 밑)
        section('내가 개설한 챌린지', hosted, listEl);
        section('참여 중인 챌린지', joined, listEl, { leave: true });
        section('취소·삭제한 챌린지', inactive, listEl);
      } catch (e) { toast(e.message, 'err'); }
    }

    function section(title, list, listEl, opts) {
      if (!list.length) return;
      listEl.appendChild(el(`<div class="section-head"><span>${title}</span></div>`));
      list.forEach((p) => listEl.appendChild(row(p, opts)));
    }

    function row(p, opts) {
      const cid = p.challengeId;
      // 취소/삭제(CANCELED)면 인증·인증글·정산 숨기고 상세만
      const inactive = p.myStatus === 'CANCELED' || p.challengeStatus === 'DELETED';
      const actions = inactive
        ? `<a class="btn btn--sm btn--ghost" href="/challenge/detail.html?id=${cid}">상세</a>`
        : `<a class="btn btn--sm btn--ghost" href="/challenge/detail.html?id=${cid}">상세</a>
           <a class="btn btn--sm btn--ghost" href="/challenge/verify.html?challengeId=${cid}">인증</a>
           <a class="btn btn--sm btn--ghost" href="/challenge/verify-list.html?challengeId=${cid}">인증글</a>
           <a class="btn btn--sm btn--ghost" href="/point/settle.html?challengeId=${cid}">정산</a>`;
      // 참여 취소(나가기) — 참여 중 섹션 && 모집중(시작 전) && 참여상태 JOINED 일 때만. 시작 후 불가, 보증금 환불.
      const canLeave = opts && opts.leave && p.challengeStatus === 'RECRUITING' && p.myStatus === 'JOINED';
      const node = el(`
        <article class="receipt receipt--wide" style="width:100%">
          <div style="display:flex;align-items:center;gap:10px">
            <strong>${esc(p.challengeTitle)}</strong>
            <div class="appbar__spacer"></div>
            ${statusStamp(p.myStatus, PARTICIPATION_STATUS)}
          </div>
          <div class="mono muted" style="margin:6px 0">성공 ${p.successCount}회</div>
          <div class="actions">${actions}</div>
        </article>`);
      if (canLeave) {
        const leave = el('<button class="btn btn--sm btn--danger">나가기</button>');
        leave.onclick = () => cancel(p);
        node.querySelector('.actions').appendChild(leave);
      }
      return node;
    }

    async function cancel(p) {
      if (!confirm('참여를 취소하고 보증금을 돌려받습니다. 계속할까요?')) return;
      try {
        await api.del('/api/participations/' + p.participationId);
        toast('참여 취소 · 보증금 환불', 'ok');
        load();
      } catch (e) { toast(e.message, 'err'); }
    }

    load();
  </script>
</body>
</html>
