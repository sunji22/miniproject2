<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 — 보증금 챌린지</title>
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/receipt.css" />
</head>
<body>
  <header class="appbar" id="appbar"></header>
  <main class="wrap center-col" style="padding-top:40px">
    <form class="receipt" id="form">
      <div class="receipt__head">※ 청산위원회<span class="receipt__no">NEW MEMBER</span></div>
      <div class="perf">· · · · · · · · · · · · ·</div>
      <hr class="rule" />
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" required placeholder="홍길동" />
      </div>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" required placeholder="me@example.com" />
      </div>
      <div class="field">
        <label for="password">비밀번호 (8자 이상)</label>
        <input type="password" id="password" required minlength="8" />
      </div>
      <div class="err-text" id="err"></div>
      <button class="btn" type="submit" id="submit">가입하기</button>
      <hr class="rule" />
      <div class="muted" style="text-align:center">이미 회원이세요? <a href="/auth/login.html">로그인 ›</a></div>
    </form>
  </main>

  <script src="/assets/js/common.js"></script>
  <script>
    const { api, session, mountHeader, toast } = App;
    mountHeader();
    if (session.isAuthed) location.href = '/';

    const form = document.getElementById('form');
    const errEl = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!name || !email) { errEl.textContent = '이름과 이메일을 입력하세요.'; return; }
      if (password.length < 8) { errEl.textContent = '비밀번호는 8자 이상이어야 합니다.'; return; }
      const btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = '가입 중…';
      try {
        await api.post('/api/users', { email, password, name });
        toast('가입 완료. 로그인하세요.', 'ok');
        location.href = '/auth/login.html';
      } catch (ex) {
        errEl.textContent = ex.message;
        btn.disabled = false; btn.textContent = '가입하기';
      }
    });
  </script>
</body>
</html>
